<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>MyDeck</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>MyDeck</h1><span id="conn" class="mut">Conectando…</span><span id="rx" class="mut"></span>
  <span class="sp"></span>
  <label class="vol">🔊<input type="range" id="master" min="0" max="100" value="100"></label>
  <button class="tool danger" id="stop">⏹ DETENER SONIDOS</button>
  <button class="tool" id="edit">⚙️ Editar Deck</button>
</header>
<main class="grid" id="grid"></main>
<div id="toast"></div>

<div id="modal" hidden>
  <div class="panel">
    <h2 id="mtitle">Botón</h2>
    <label class="file">📁 Subir / cambiar sonido (MP3, WAV, M4A)
      <input type="file" id="file" accept=".mp3,.wav,.m4a,audio/mpeg,audio/wav,audio/x-wav,audio/mp4,audio/x-m4a" hidden>
    </label>
    <div class="mut" id="finfo"></div>
    <label>Nombre<input type="text" id="name" maxlength="24" placeholder="Ej. BRUH"></label>
    <label>Emoji<input type="text" id="emoji" maxlength="4"></label>
    <div class="row emojis" id="emojis"></div>
    <label>Volumen: <b id="vval">100</b>%<input type="range" id="vol" min="0" max="100" value="100"></label>
    <div class="row">
      <button class="tool" id="test">▶ Probar (en la PC)</button>
      <button class="tool" id="left">◀ Mover</button>
      <button class="tool" id="right">Mover ▶</button>
    </div>
    <div class="row">
      <button class="tool danger" id="del">🗑 Eliminar</button>
      <button class="tool" id="close">Cerrar</button>
      <button class="tool on" id="save">Guardar</button>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let ws, config = null, st = null, edit = false, cur = null;
let key = new URLSearchParams(location.search).get('key') || localStorage.getItem('mydeckKey') || '';

const toast = (t) => { const e = $('toast'); e.textContent = t; e.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => (e.style.display = 'none'), 2800); };
const wsend = (o) => (ws?.readyState === 1 ? (ws.send(JSON.stringify(o)), true) : (toast('Sin conexión con la PC'), false));
async function api(method, url, body, headers = {}) {
  const isBlob = body instanceof Blob;
  const r = await fetch(url, { method, headers: { 'x-key': key, ...(body && !isBlob ? { 'Content-Type': 'application/json' } : {}), ...headers }, body: body ? (isBlob ? body : JSON.stringify(body)) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'Error ' + r.status);
  return j;
}

function connect() {
  if (!key) { key = prompt('PIN de MyDeck'); if (!key) return; }
  ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/?key=${encodeURIComponent(key)}&role=controller`);
  ws.onopen = () => { localStorage.setItem('mydeckKey', key); $('conn').textContent = '● En línea'; $('conn').className = 'mut on'; };
  ws.onclose = (e) => {
    $('conn').textContent = 'Reconectando…'; $('conn').className = 'mut';
    if (e.code === 4001) { localStorage.removeItem('mydeckKey'); key = ''; }
    setTimeout(connect, 1500);
  };
  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.type === 'state') { st = m.state; render(); }
    if (m.type === 'config') { config = m.config; render(); refreshModal(); }
    if (m.type === 'error') toast('⚠️ ' + m.message);
  };
}

function press(btn, onTap, onLong) {
  let t, long = false;
  btn.onpointerdown = () => { long = false; t = setTimeout(() => { long = true; onLong?.(); }, 600); };
  const end = () => clearTimeout(t);
  btn.onpointerup = () => { end(); if (!long) onTap(); };
  btn.onpointerleave = end; btn.onpointercancel = end; btn.oncontextmenu = (e) => e.preventDefault();
}
const mk = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt !== undefined) e.textContent = txt; return e; };

function render() {
  $('edit').classList.toggle('on', edit);
  $('edit').textContent = edit ? '✅ Terminar edición' : '⚙️ Editar Deck';
  if (st) $('rx').textContent = st.receivers ? (st.audioReady ? '🖥️ PC lista' : '🖥️ PC sin audio activado') : '🖥️ Sin receptor';
  if (!config) return;
  if (document.activeElement !== $('master')) $('master').value = config.master;
  const g = $('grid'); g.innerHTML = '';
  // Botón 1: Discord
  const d = mk('button', 'btn'); d.id = 'discord';
  d.append(mk('span', '', '🎙️ Discord'));
  const s = mk('small');
  const ds = st?.discord;
  if (!ds?.connected) { d.classList.add('off'); s.textContent = 'SIN CONEXIÓN'; }
  else if (ds.muted) { d.classList.add('bad'); s.textContent = '🔴 MUTEADO'; }
  else { d.classList.add('ok'); s.textContent = '🟢 ACTIVO'; }
  d.append(s);
  press(d, () => { navigator.vibrate?.(30); wsend({ action: 'discord.toggleMute' }); });
  g.append(d);
  // Botones 2–6: soundboard
  config.slots.forEach((sl) => {
    const b = mk('button', 'btn' + (sl.file ? '' : ' empty') + (edit ? ' editing' : ''));
    if (sl.file) { b.append(mk('span', 'emo', sl.emoji), mk('span', '', sl.name || 'Sonido')); }
    else { b.append(mk('span', 'emo', '＋'), mk('span', '', 'Vacío')); }
    press(b, () => {
      if (edit || !sl.file) return openEditor(sl.id);
      navigator.vibrate?.(30); wsend({ action: 'sound.play', id: sl.id });
    }, () => openEditor(sl.id));
    g.append(b);
  });
}

// ---- Editor ----
const EMOJIS = ['😂', '🔥', '💀', '👏', '🎺', '😱', '🥁', '🚨', '💥', '🤣', '😎', '❤️'];
EMOJIS.forEach((e) => { const b = mk('button', '', e); b.onclick = () => ($('emoji').value = e); $('emojis').append(b); });
const slot = () => config?.slots.find((s) => s.id === cur);
function openEditor(id) {
  cur = id; const s = slot(); if (!s) return;
  $('mtitle').textContent = 'Botón ' + (config.slots.indexOf(s) + 2);
  $('name').value = s.name; $('emoji').value = s.emoji; $('vol').value = s.volume; $('vval').textContent = s.volume;
  refreshModal(); $('modal').hidden = false;
}
function refreshModal() {
  const s = slot(); if ($('modal').hidden || !s) return;
  $('finfo').textContent = s.file ? '🎵 ' + (s.orig || s.file) : 'Sin sonido todavía';
}
const close = () => { $('modal').hidden = true; cur = null; };
$('close').onclick = close;
$('vol').oninput = () => ($('vval').textContent = $('vol').value);
$('file').onchange = async (e) => {
  const f = e.target.files[0]; e.target.value = ''; if (!f || !cur) return;
  try {
    $('finfo').textContent = 'Subiendo…';
    await api('POST', '/api/upload/' + cur, f, { 'x-filename': encodeURIComponent(f.name) });
    if (!$('name').value.trim()) $('name').value = f.name.replace(/\.[^.]+$/, '').slice(0, 24);
    toast('Sonido subido. Pulsa Guardar.');
  } catch (err) { toast('⚠️ ' + err.message); refreshModal(); }
};
$('save').onclick = async () => {
  try { await api('PATCH', '/api/slot/' + cur, { name: $('name').value.trim(), emoji: $('emoji').value, volume: +$('vol').value }); close(); }
  catch (err) { toast('⚠️ ' + err.message); }
};
$('test').onclick = () => wsend({ action: 'sound.play', id: cur, volume: +$('vol').value });
$('del').onclick = async () => {
  if (!confirm('¿Eliminar este sonido?')) return;
  try { await api('DELETE', '/api/slot/' + cur); close(); } catch (err) { toast('⚠️ ' + err.message); }
};
async function move(dir) {
  const ids = config.slots.map((s) => s.id), i = ids.indexOf(cur), j = i + dir;
  if (j < 0 || j >= ids.length) return toast('No se puede mover más');
  [ids[i], ids[j]] = [ids[j], ids[i]];
  try { await api('PUT', '/api/order', { order: ids }); $('mtitle').textContent = 'Botón ' + (j + 2); } catch (err) { toast('⚠️ ' + err.message); }
}
$('left').onclick = () => move(-1); $('right').onclick = () => move(1);

// ---- Controles generales ----
$('edit').onclick = () => { edit = !edit; render(); };
$('stop').onclick = () => { navigator.vibrate?.(60); wsend({ action: 'sound.stop' }); };
let mt; $('master').oninput = () => { clearTimeout(mt); mt = setTimeout(() => api('PUT', '/api/prefs', { master: +$('master').value }).catch((e) => toast('⚠️ ' + e.message)), 120); };
connect();
</script>
</body>
</html>
